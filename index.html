  <main>

    <!-- ============ 1 首屏 ============ -->
    <section class="hero" id="top">
      <div class="hero__sky" aria-hidden="true"></div>
      <div class="wrap hero__inner">

        <p class="hero__eyebrow">聪聪明和小叮当</p>
        <h1 class="hero__name">合力</h1>

        <div class="hero__art">
          <picture>
            <source media="(max-width:640px)" srcset="hero-couple-mobile.webp"
                    width="900" height="900">
            <img class="hero__img" src="hero-couple.webp" width="1600" height="900"

          </picture>
        </div>


      </div>

                   alt="手绘头像：小叮当，黑色及肩长发、齐刘海，笑起来眼睛弯成月牙">
            </div>
            <h3 class="card__name">小叮当</h3>
            <p class="card__desc">笑起来眼睛会弯。</p>
          </article>

          <article class="card">
            <div class="card__art">

                   alt="手绘头像：合力，黑色短发、戴细边圆框眼镜，微微笑">
            </div>
            <h3 class="card__name">合力</h3>
            <p class="card__desc">赚钱钱大王。</p>
          </article>

        </div>
      </div>
